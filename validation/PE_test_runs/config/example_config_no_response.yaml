# Example config for sample.py (PE run WITHOUT the LISA response).
#
# The likelihood is evaluated directly as a Whittle inner product of the
# detector-frame complex strain h+ - i hx against the analytic LISA PSD
# (LISASens). No TDI, no Mojito noise, no fastlisaresponse. Use this for
# waveform-stability checks and fast exploratory runs.
#
# Schema mirrors config_test_1.yaml but omits the Data and Response blocks.

Injection:
    EMRI:
        M: 1000000.0
        mu: 6.0
        a: 0.00002
        p0: 10.0
        e0: 0.0
        chi2: 0.9
        x_I0: 1.0
        d_L: 0.1
        theta_S: 0.5689062462243505
        phi_S: 3.069569972026508
        theta_K: 0.11247032308126413
        phi_K: 0.7524383205999023
        Phi_phi0: 4.809727148143657
        Phi_theta0: 0.635376120342196
        Phi_r0: 4.2638433178190684

    Waveform:
        model: 1PAT1R              # '1PAT1R' or '0PA_Kerr'
        evolve_chi1: true
        include_1PA_amps: true
        dt: 5
        T: 2
        mode_selection_threshold: 0.0
        inspiral_kwargs:
            DENSE_STEPPING: 0
            max_init_len: 1000
        summation_kwargs:
            pad_output: true
        amplitude_kwargs: {}

Recovery:
    # Leave equal to the injection for a self-consistent run; flip
    # evolve_chi1 / include_1PA_amps or switch model to '0PA_Kerr' to
    # probe systematics. Both sides must share the parameter space.
    Waveform:
        model: 1PAT1R
        evolve_chi1: true
        include_1PA_amps: true
        dt: 5
        T: 2
        mode_selection_threshold: 0.0
        inspiral_kwargs:
            DENSE_STEPPING: 0
            max_init_len: 1000
        summation_kwargs:
            pad_output: true
        amplitude_kwargs: {}

Sampler:
    name: no_response_example
    windowing: true
    filter_freq: true
    num_samples: 10000
    burn_in: 0
    use_gpu: true
    n_temps: 3
    n_walkers: 30
    d: 5
    continue_run: false
    sampling_data_path: ../sampling_data
    plots_path: ../Plots
    fixed_params: ['x_I0']
